# Blueprint de Render para el backend (https://render.com/docs/blueprint-spec).
# El frontend vive en Vercel y llega a esta API vía rewrites (apps/frontend/vercel.json).
# Guía completa de despliegue: docs/deploy-render.md

databases:
  - name: dracing-db
    plan: free
    databaseName: dracing
    user: dracing
    # Sin acceso externo por defecto; para correr migraciones desde tu máquina
    # agrega tu IP en el dashboard o usa la shell del servicio.

services:
  - type: web
    name: dracing-backend
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    # En planes pagos, descomenta para aplicar migraciones antes de cada deploy.
    # En el plan free ejecútalas manualmente: docs/deploy-render.md#migraciones
    # preDeployCommand: node packages/database/scripts/migrate.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: TZ
        value: America/Santiago
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dracing-db
          property: connectionString
      # Origen público de la app (dominio de Vercel), p. ej. https://dracingpro.vercel.app
      - key: APP_ORIGIN
        sync: false
      # Origen público de la API. Con rewrites de Vercel es el MISMO dominio de Vercel,
      # porque el navegador y Flow llegan a /v1 a través del proxy.
      - key: API_ORIGIN
        sync: false
      # OAuth de Google: el redirect debe pasar por el dominio de Vercel,
      # p. ej. https://dracingpro.vercel.app/v1/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Flow: sandbox por defecto; cambiar a https://www.flow.cl/api al pasar a producción.
      - key: FLOW_API_BASE
        value: https://sandbox.flow.cl/api
      - key: FLOW_API_KEY
        sync: false
      - key: FLOW_SECRET_KEY
        sync: false

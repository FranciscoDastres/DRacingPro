server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Content-Security-Policy ajustada a la SPA construida por Vite: el JS/CSS se
  # sirve como bundles externos del mismo origen (sin scripts inline), por eso
  # script-src es 'self' estricto. style-src permite 'unsafe-inline' por los
  # pocos atributos style en línea de React y los estilos de Tailwind. La API se
  # consume del mismo origen vía este nginx (/v1, /api), así que connect-src es
  # 'self'. Los redireccionamientos a Google OAuth y Flow son navegaciones de
  # página completa (no fetch/iframe), por lo que no requieren excepciones aquí.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
  # HSTS: fuerza HTTPS durante 2 años. 'preload' implica enviar el dominio a
  # https://hstspreload.org (compromiso difícil de revertir): habilitarlo solo
  # cuando todo el dominio y sus subdominios sirvan exclusivamente por HTTPS.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  # Bloquea APIs potentes del navegador que la app no usa.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  # Compresión de texto (Lighthouse: "Enable text compression"). Se omiten
  # woff2/webp/imágenes porque ya vienen comprimidos: gzipearlos gasta CPU sin
  # ganancia. Sirve los assets de Vite (JS/CSS) y los XML/JSON de SEO.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /v1 {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets con huella de contenido (Vite versiona el nombre): cache de 1 año
  # (Lighthouse: "Serve static assets with an efficient cache policy"). Se usa
  # solo `expires` —no `add_header`— para no anular la herencia de las cabeceras
  # de seguridad de arriba en estas respuestas.
  location ~* \.(?:js|css|woff2|webp|png|jpe?g|gif|svg|ico)$ {
    expires 1y;
    access_log off;
    try_files $uri =404;
  }

  location / {
    # El HTML nunca se cachea para que cada despliegue se vea de inmediato.
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
